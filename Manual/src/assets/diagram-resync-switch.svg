<svg viewBox="0 0 900 345" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
  <defs>
    <linearGradient id="fadeA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b68c9" stop-opacity="1"/>
      <stop offset="1" stop-color="#7b68c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="riseB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e8f" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2f9e8f" stop-opacity="1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="343" rx="14" fill="#f8f8fc" stroke="#dcdce6"/>
  <text x="450" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Resync の流れ：２系統の切替</text>
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#666">切替の準備中も現用系統の音声が流れ続けるため、音声の途切れが最小限に抑えられます</text>

  <!-- クロスフェード帯（両系統にまたがる） -->
  <rect x="650" y="82" width="80" height="146" fill="#3a3a4a" opacity="0.06"/>
  <line x1="650" y1="82" x2="650" y2="240" stroke="#bbb" stroke-dasharray="3 3"/>
  <line x1="730" y1="82" x2="730" y2="240" stroke="#bbb" stroke-dasharray="3 3"/>
  <text x="690" y="256" text-anchor="middle" font-size="11.5" fill="#555">クロスフェード</text>

  <!-- 系統ラベル -->
  <text x="138" y="122" text-anchor="end" font-size="13.5" font-weight="bold" fill="#444">現用系統</text>
  <text x="138" y="204" text-anchor="end" font-size="13.5" font-weight="bold" fill="#444">予備系統</text>

  <!-- 現用系統（上段） -->
  <rect x="150" y="94" width="500" height="46" rx="5" fill="#7b68c9"/>
  <rect x="650" y="94" width="80" height="46" fill="url(#fadeA)"/>
  <text x="395" y="122" text-anchor="middle" font-size="13" fill="#fff">再生中（音声・映像が流れ続ける）</text>
  <rect x="742" y="94" width="118" height="46" rx="5" fill="none" stroke="#999" stroke-dasharray="4 3"/>
  <text x="801" y="115" text-anchor="middle" font-size="11.5" fill="#777">停止</text>
  <text x="801" y="131" text-anchor="middle" font-size="10.5" fill="#999">（役割を交代）</text>

  <!-- 予備系統（下段） -->
  <line x1="150" y1="199" x2="386" y2="199" stroke="#bbb" stroke-dasharray="4 4"/>
  <text x="268" y="191" text-anchor="middle" font-size="11" fill="#999">待機</text>
  <rect x="390" y="176" width="140" height="46" rx="5" fill="#e2f0ee" stroke="#2f9e8f"/>
  <text x="460" y="204" text-anchor="middle" font-size="12.5" fill="#1e6e63">接続</text>
  <rect x="530" y="176" width="120" height="46" rx="5" fill="#bfe2dc" stroke="#2f9e8f"/>
  <text x="590" y="204" text-anchor="middle" font-size="12.5" fill="#1e6e63">再生を確認</text>
  <rect x="650" y="176" width="80" height="46" fill="url(#riseB)"/>
  <rect x="730" y="176" width="130" height="46" rx="5" fill="#2f9e8f"/>
  <text x="795" y="197" text-anchor="middle" font-size="11.5" fill="#fff">再生中</text>
  <text x="795" y="212" text-anchor="middle" font-size="10.5" fill="#e6f5f2">（新しい現用系統）</text>

  <!-- 手順番号（本文の１〜５に対応） -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="390" cy="170" r="11" fill="#5a4aa8"/>
    <text x="390" y="174.5" fill="#fff">1</text>
    <circle cx="530" cy="170" r="11" fill="#5a4aa8"/>
    <text x="530" y="174.5" fill="#fff">2</text>
    <circle cx="672" cy="158" r="11" fill="#5a4aa8"/>
    <text x="672" y="162.5" fill="#fff">3</text>
    <circle cx="708" cy="158" r="11" fill="#5a4aa8"/>
    <text x="708" y="162.5" fill="#fff">4</text>
    <circle cx="742" cy="88" r="11" fill="#5a4aa8"/>
    <text x="742" y="92.5" fill="#fff">5</text>
  </g>

  <!-- 時間軸 -->
  <line x1="150" y1="288" x2="860" y2="288" stroke="#888" marker-end="url(#arrow)"/>
  <text x="505" y="312" text-anchor="middle" font-size="12" fill="#666">時間の経過</text>
</svg>
