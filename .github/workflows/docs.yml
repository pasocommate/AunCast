name: Deploy Manual (GitHub Pages)

# リリースタグ（x.y.z）を push したときにビルド・公開する（release.yml と同じトリガー）。
# 手動で公開し直したいときは workflow_dispatch から実行する。
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない（デプロイの取り違えを防ぐ）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: Manual/requirements-docs.txt
      - run: pip install -r Manual/requirements-docs.txt
      - run: mkdocs build -f Manual/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Manual/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
