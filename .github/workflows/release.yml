name: Build Release

on:
  push:
    tags:
      - "*.*.*"

env:
  PACKAGE_NAME: tokyo.chigiri.pasocommate.auncast
  VPM_LISTING_REPOSITORY: pasocommate/vpm-listing
  VPM_LISTING_WORKFLOW: build-listing.yml
  VPM_LISTING_REF: main

jobs:

  # Validate Repository Configuration
  config:
    runs-on: ubuntu-latest
    outputs:
      config_package: ${{ steps.config_package.outputs.configPackage }}
    steps:

    # Ensure that required package name is set
    - name: Validate Package Config
      id: config_package
      run: |
        if [ "${{ env.PACKAGE_NAME }}" != "" ]; then
          echo "configPackage=true" >> $GITHUB_OUTPUT;
        else
          echo "configPackage=false" >> $GITHUB_OUTPUT;
        fi

  # Build and release the Package
  # If the repository is not configured properly, this job will be skipped
  build:
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: Packages/tokyo.chigiri.pasocommate.auncast
      listingRepository: pasocommate/vpm-listing
      listingWorkflow: build-listing.yml
      listingRef: main
    if: needs.config.outputs.config_package == 'true'
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with: 
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"
    
      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.value }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV
          echo "tag=${{ github.ref_name }}" >> $GITHUB_ENV

      # Validate pushed tag format as x.y.z
      - name: Validate Tag Format
        run: |
          if [[ ! "${{ env.tag }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag format must be x.y.z (e.g. 1.4.0). actual: ${{ env.tag }}"
            exit 1
          fi

      # Validate pushed tag matches package.json version
      - name: Validate Tag Version
        run: |
          if [ "${{ env.tag }}" != "${{ env.version }}" ]; then
            echo "::error::Tag version (${{ env.tag }}) does not match package.json version (${{ env.version }})."
            exit 1
          fi

      # Zip the Package for release
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .
      
      # Build a list of .meta files for future use
      - name: Track Package Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta >> metaList
      
      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList
      
      # Extract release notes for this version from CHANGELOG.md
      - name: Extract Release Notes
        run: |
          awk '/^## \[${{ env.version }}\]/{found=1; next} /^## \[/{if(found) exit} found' \
            "${{ env.packagePath }}/CHANGELOG.md" > release_notes.txt

      # Publish the Release to GitHub
      - name: Make Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ env.tag }}
          body_path: release_notes.txt

      # package-list-action が Release と配布アセットを取得できる状態になるまで待つ
      # （Release 作成直後は GitHub API の反映が遅れる場合がある）
      - name: Wait for release to propagate to vpm-listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          required_assets=("${{ env.zipFile }}" "${{ env.unityPackage }}" "package.json")

          for attempt in {0..12}; do
            release_json="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${{ env.tag }}")" || true

            if [ -n "${release_json}" ] && [ "$(jq -r '.draft' <<< "${release_json}")" = "false" ]; then
              missing_assets=()
              for asset in "${required_assets[@]}"; do
                if ! jq -e --arg asset "${asset}" '.assets[] | select(.name == $asset)' \
                  <<< "${release_json}" > /dev/null; then
                  missing_assets+=("${asset}")
                fi
              done

              if [ "${#missing_assets[@]}" -eq 0 ]; then
                echo "Release ${{ env.tag }} and all distribution assets are available."
                # 別ワーカーで起動する vpm-listing からも取得できるよう、反映を待つ。
                sleep 30
                exit 0
              fi

              echo "Release is present, but missing assets: ${missing_assets[*]}"
            else
              echo "Release ${{ env.tag }} is not available yet."
            fi

            if [ "${attempt}" -lt 12 ]; then
              sleep 10
            fi
          done

          echo "::error::Release ${{ env.tag }} and its distribution assets did not become available within 120 seconds."
          exit 1

      - name: Evaluate vpm-listing dispatch condition
        id: listing_dispatch
        env:
          LISTING_TOKEN: ${{ secrets.VPM_LISTING_REPO_TOKEN }}
          LISTING_REPOSITORY: ${{ env.listingRepository }}
        run: |
          if [ -n "${LISTING_REPOSITORY}" ] && [ -n "${LISTING_TOKEN}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger vpm-listing workflow
        if: ${{ steps.listing_dispatch.outputs.enabled == 'true' }}
        uses: actions/github-script@v7
        env:
          LISTING_REPOSITORY: ${{ env.listingRepository }}
          LISTING_WORKFLOW: ${{ env.listingWorkflow }}
          LISTING_REF: ${{ env.listingRef }}
        with:
          github-token: ${{ secrets.VPM_LISTING_REPO_TOKEN }}
          script: |
            const repository = process.env.LISTING_REPOSITORY;
            const [owner, repo] = repository.split("/");
            if (!owner || !repo) {
              core.setFailed(`VPM_LISTING_REPOSITORY format is invalid: ${repository}`);
              return;
            }

            const workflow_id = process.env.LISTING_WORKFLOW || "build-listing.yml";
            const ref = process.env.LISTING_REF || "main";

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref
            });

            core.info(`Dispatched ${workflow_id} on ${owner}/${repo} (${ref})`);

      - name: Skip vpm-listing dispatch
        if: ${{ steps.listing_dispatch.outputs.enabled != 'true' }}
        run: |
          echo "::notice::Skip remote listing dispatch. Set VPM_LISTING_REPOSITORY variable and VPM_LISTING_REPO_TOKEN secret to enable it."
